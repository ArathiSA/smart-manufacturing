<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Smart Manufacturing</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #0b1f33;
            color: white;
            padding: 18px 8%;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .login-container h2 {
            text-align: center;
            color: #0b1f33;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2196f3;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1976d2;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2196f3;
            text-decoration: none;
            font-size: 14px;
        }

        footer {
            margin-top: auto;
            background: #0b1f33;
            color: white;
            text-align: center;
            padding: 18px;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <header>

        <h1>🏭 Smart Manufacturing</h1>

    </header>


    <div class="login-container">

        <h2>Admin Login</h2>

        <p>Login to access the admin dashboard.</p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" action="/admin-login">

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                Login
            </button>

        </form>


        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>


    <footer>

        © 2026 Smart Manufacturing | All Rights Reserved

    </footer>

</body>

</html>
